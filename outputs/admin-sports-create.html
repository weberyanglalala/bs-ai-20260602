<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>後台商品上架｜體育用品電商</title>
  <meta name="description" content="體育用品電商後台單一商品上架示意頁，包含商品基本資料、規格尺寸、保固與配送設定。">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f8ff;
      --card: rgba(255, 255, 255, 0.9);
      --accent: #2563eb;
      --accent-soft: #e1ecff;
      --ink: #1e3a8a;
    }
    body {
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.14), transparent 26%),
        linear-gradient(180deg, #fbfdff 0%, var(--bg) 100%);
      color: #1f2937;
    }
    .topbar { background: rgba(17, 24, 39, 0.96); backdrop-filter: blur(10px); }
    .panel {
      background: var(--card);
      border: 1px solid rgba(31, 41, 55, 0.08);
      box-shadow: 0 16px 36px rgba(31, 41, 55, 0.08);
      border-radius: 1.5rem;
    }
    .page-title { letter-spacing: -0.03em; }
    .section-chip {
      background: var(--accent-soft);
      color: var(--ink);
      border: 1px solid rgba(37, 99, 235, 0.12);
    }
    .preview-box {
      border: 1px dashed rgba(37, 99, 235, 0.35);
      background: linear-gradient(180deg, #fff 0%, #eef4ff 100%);
      border-radius: 1.25rem;
    }
    .help-list li + li { margin-top: .5rem; }
    .form-label { font-weight: 600; }
  </style>
</head>
<body>
  <!-- ===== 後台導覽列 開始 ===== -->
  <header class="topbar text-white">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid px-3 px-lg-4">
        <a class="navbar-brand fw-bold" href="#">體育用品電商後台</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavSports" aria-controls="adminNavSports" aria-expanded="false" aria-label="切換導覽">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="adminNavSports">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">商品管理</a></li>
            <li class="nav-item"><a class="nav-link" href="#">會員管理</a></li>
            <li class="nav-item"><a class="nav-link" href="#">保固設定</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <!-- ===== 後台導覽列 結束 ===== -->

  <main class="container-fluid px-3 px-lg-4 py-4">
    <!-- ===== 頁首資訊 開始 ===== -->
    <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-4">
      <div>
        <span class="badge rounded-pill section-chip mb-2">單一商品上架示意</span>
        <h1 class="display-6 fw-bold page-title mb-2">新增體育用品</h1>
        <p class="text-secondary mb-0">這個頁面偏向運動器材與電子運動配件的商品建立流程，特別強調尺寸、保固與配送方式。</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-outline-secondary">儲存草稿</button>
        <button class="btn btn-dark">送出審核</button>
      </div>
    </div>
    <!-- ===== 頁首資訊 結束 ===== -->

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="panel p-4 p-lg-5">
          <form>
            <section class="mb-4">
              <h2 class="h4 fw-bold mb-3">商品基本資料</h2>
              <div class="row g-3">
                <div class="col-md-8">
                  <label class="form-label" for="name">商品名稱</label>
                  <input id="name" type="text" class="form-control" value="ProFit 智慧運動手錶">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="price">售價</label>
                  <input id="price" type="text" class="form-control" value="3280">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="category">商品分類</label>
                  <select id="category" class="form-select">
                    <option selected>電子配件</option>
                    <option>健身器材</option>
                    <option>球類用品</option>
                    <option>訓練配件</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="status">上架狀態</label>
                  <select id="status" class="form-select">
                    <option selected>待審核</option>
                    <option>草稿</option>
                    <option>立即上架</option>
                    <option>下架</option>
                  </select>
                </div>
              </div>
            </section>

            <section class="mb-4">
              <h2 class="h4 fw-bold mb-3">商品描述</h2>
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label" for="summary">商品簡介</label>
                  <textarea id="summary" class="form-control" rows="4">智慧運動手錶，支援運動紀錄、心率監測、睡眠追蹤與日常通知。</textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="highlights">商品特色</label>
                  <textarea id="highlights" class="form-control" rows="5">電子類商品、1 年保固、適合跑步健身、可宅配或超商取貨。</textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="usecases">適用情境</label>
                  <textarea id="usecases" class="form-control" rows="5">跑步、重訓、日常健康追蹤、工作通知同步。</textarea>
                </div>
              </div>
            </section>

            <section class="mb-4">
              <h2 class="h4 fw-bold mb-3">規格與保固</h2>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="size">尺寸 / 規格</label>
                  <input id="size" type="text" class="form-control" value="1.43 吋 AMOLED">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="material">材質</label>
                  <input id="material" type="text" class="form-control" value="鋁合金 / 矽膠錶帶">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="warranty">保固</label>
                  <input id="warranty" type="text" class="form-control" value="1 年保固">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="battery">續航</label>
                  <input id="battery" type="text" class="form-control" value="約 7-10 天">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="water">防水等級</label>
                  <select id="water" class="form-select">
                    <option selected>日常防潑水</option>
                    <option>生活防水</option>
                    <option>IP67</option>
                    <option>IP68</option>
                  </select>
                </div>
              </div>
            </section>

            <section class="mb-4">
              <h2 class="h4 fw-bold mb-3">物流與付款設定</h2>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="form-label" for="ship">配送方式</label>
                  <select id="ship" class="form-select">
                    <option selected>宅配到府 / 超商取貨</option>
                    <option>宅配到府</option>
                    <option>超商取貨</option>
                  </select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="leadtime">出貨天數</label>
                  <input id="leadtime" type="text" class="form-control" value="1-2 個工作天">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="pay">付款方式</label>
                  <select id="pay" class="form-select">
                    <option selected>信用卡 / ATM / 超商代碼 / 行動支付 / 貨到付款</option>
                    <option>信用卡</option>
                    <option>貨到付款</option>
                  </select>
                </div>
                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="note1" checked>
                    <label class="form-check-label" for="note1">若為電子類商品，已啟用 1 年保固資訊與客服處理流程</label>
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="note2" checked>
                    <label class="form-check-label" for="note2">超材積商品會自動改用宅配或專車配送</label>
                  </div>
                </div>
              </div>
            </section>

            <section>
              <h2 class="h4 fw-bold mb-3">SEO 與發布</h2>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="slug">網址代稱</label>
                  <input id="slug" type="text" class="form-control" value="sports-smart-watch">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="tags">標籤</label>
                  <input id="tags" type="text" class="form-control" value="智慧手錶,運動,健身,保固">
                </div>
                <div class="col-12">
                  <label class="form-label" for="meta">Meta Description</label>
                  <textarea id="meta" class="form-control" rows="3">ProFit 智慧運動手錶後台上架示意，包含規格、保固與配送設定。</textarea>
                </div>
              </div>
            </section>
          </form>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="panel p-4 mb-4">
          <h2 class="h5 fw-bold mb-3">上架預覽</h2>
          <div class="preview-box p-4">
            <p class="small text-secondary mb-1">體育用品電商 / 電子配件</p>
            <h3 class="h4 fw-bold mb-2">ProFit 智慧運動手錶</h3>
            <p class="mb-2">售價 NT$3,280</p>
            <p class="small text-secondary mb-0">1 年保固、宅配與超商取貨皆可。</p>
          </div>
        </div>
        <div class="panel p-4">
          <h2 class="h5 fw-bold mb-3">上架提醒</h2>
          <ul class="help-list text-secondary ps-3 mb-0">
            <li>請明確填寫保固年限與適用範圍。</li>
            <li>若商品為超材積，超商取貨需自動關閉。</li>
            <li>貨到付款可加上金額上限提示。</li>
            <li>建議補上電池續航、尺寸與材質欄位。</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
